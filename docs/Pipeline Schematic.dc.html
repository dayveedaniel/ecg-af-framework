<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<div style="width:max-content;min-width:100%;min-height:100vh;box-sizing:border-box;padding:56px 64px;background:#e7e5df;font-family:'IBM Plex Mono',ui-monospace,monospace">

  <div style="max-width:1360px;margin-bottom:44px">
    <div style="font-size:12px;letter-spacing:2px;color:#9a968c;font-weight:600;margin-bottom:10px">FLOWCHART</div>
    <div style="font-size:30px;font-weight:700;color:#23211c;letter-spacing:-0.5;font-family:'IBM Plex Sans',system-ui,sans-serif">Framework pipeline</div>
    <div style="font-size:14px;color:#6f6b61;margin-top:10px;line-height:1.55;font-family:'IBM Plex Sans',system-ui,sans-serif;max-width:760px">Inputs wire into the stages that read them. Each store and cache has its own box — stores receive writes from stages and send reads back. Blue = PostgreSQL, orange = Object Store, green = cache.</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:52px">

    <div>
      <div style="width:1360px;border-radius:3px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.12);--bg:#fbfbf9;--grid:#ecebe6;--panel:#ffffff;--ink:#1f2329;--muted:#868c95;--read:#aeb4bc;--frame:#dad9d3;--flow:#3a4049;--cached:#0e9f6e;--nocache:#7c5cff;--db:#2f6fed;--art:#e3850a;--term:#e02f4f">
        <div style="width:100%"><svg viewBox="0 0 1420 900" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;font-family:'IBM Plex Mono',ui-monospace,monospace;background:var(--bg,#fbfbf9)" role="img" aria-label="Framework pipeline schematic">
  <defs>
    <pattern id="pdgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="var(--grid,#ecebe6)" stroke-width="1"/>
    </pattern>
    <marker id="m-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="var(--flow,#3a4049)"/></marker>
    <marker id="m-db"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="var(--db,#2f6fed)"/></marker>
    <marker id="m-art"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="var(--art,#e3850a)"/></marker>
    <marker id="m-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="var(--read,#aeb4bc)"/></marker>
    <marker id="m-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="var(--cached,#0e9f6e)"/></marker>
  </defs>

  <!-- background + frame -->
  <rect x="0" y="0" width="1420" height="900" fill="var(--bg,#fbfbf9)"/>
  <rect x="20" y="20" width="1380" height="860" rx="2" fill="url(#pdgrid)" stroke="var(--frame,#dad9d3)" stroke-width="1"/>
  <path d="M32 46V32H46 M1388 32H1374 M1388 32V46 M32 851V865H46 M1388 865H1374 M1388 865V851" fill="none" stroke="var(--frame,#dad9d3)" stroke-width="1.4"/>

  <!-- title -->
  <text x="40" y="60" font-size="30" font-weight="700" fill="var(--ink,#1f2329)" letter-spacing="-0.5">Framework Architecture</text>
  <text x="42" y="84" font-size="13" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)">ML pipeline · caching · feature engineering · evaluation</text>

  <!-- column labels -->
  <text x="42"  y="108" font-size="11" font-weight="600" fill="var(--muted,#868c95)" letter-spacing="2">INPUTS</text>
  <text x="360" y="108" font-size="11" font-weight="600" fill="var(--muted,#868c95)" letter-spacing="2">PIPELINE STAGES</text>
  <text x="800" y="108" font-size="11" font-weight="600" fill="var(--muted,#868c95)" letter-spacing="2">STORES / CACHES</text>

  <!-- ===== INPUT ===== -->
  <g font-family="'IBM Plex Sans',system-ui,sans-serif">
    <rect x="40" y="118" width="168" height="56" rx="4" fill="none" stroke="var(--read,#aeb4bc)" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="52" y="144" font-size="13" font-weight="500" font-family="'IBM Plex Mono',monospace" fill="var(--ink,#1f2329)">benchmark.yaml</text>
    <text x="52" y="161" font-size="10" fill="var(--muted,#868c95)">config + model list</text>
  </g>
  <path d="M208 146H356" fill="none" stroke="var(--read,#aeb4bc)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m-read)"/>

  <!-- ===== STORE / CACHE BOXES (left=800, width=310) =====
       Order: PostgreSQL · Split Cache · Feature Cache · Object Store
       Caches sit directly across from the stages they serve → short near-horizontal wires.

       y positions (top / center / bottom):
         PostgreSQL   : 118 / 152 / 186
         Split Cache  : 228 / 262 / 296   ← across from make-splits (stage 02, center 240)
         Feature Cache: 338 / 372 / 406   ← across from build-features (stage 03, center 330)
         Object Store : 448 / 482 / 516

       ROUTING CORRIDOR  x=600–800  (200 px)
         Write lanes (stage → store, solid arrows) : x = 616 624 632  642 650  660 668 676 684
         Read  lanes (store → stage, dashed)       : x = 750 758  764  770  776 782
         Lanes are separated into write (<650) and read (>748) halves so they never share
         the same x column — crossing only occurs where a long-distance read (PG→dashboard,
         OS→build-features) must pass through the Object Store write region, and those
         crossings are always at right angles with distinct colours.
  -->

  <!-- PostgreSQL  y=118–186  center_y=152 -->
  <rect x="800" y="118" width="310" height="68" rx="4" fill="var(--panel,#fff)" stroke="var(--db,#2f6fed)" stroke-width="1.8"/>
  <rect x="802" y="120" width="5" height="64" fill="var(--db,#2f6fed)" rx="1"/>
  <text x="960" y="145" font-size="14" font-weight="600" fill="var(--db,#2f6fed)" text-anchor="middle">PostgreSQL</text>
  <text x="960" y="163" font-size="10" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)" text-anchor="middle">run + metric tables · recordings catalog</text>

  <!-- Split Cache  y=228–296  center_y=262 -->
  <rect x="800" y="228" width="310" height="68" rx="4" fill="var(--panel,#fff)" stroke="var(--cached,#0e9f6e)" stroke-width="1.8"/>
  <rect x="802" y="230" width="5" height="64" fill="var(--cached,#0e9f6e)" rx="1"/>
  <text x="960" y="255" font-size="14" font-weight="600" fill="var(--cached,#0e9f6e)" text-anchor="middle">Split Cache (S3)</text>
  <text x="960" y="273" font-size="10" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)" text-anchor="middle">subject-safe train / val / test split map</text>

  <!-- Feature Cache  y=338–406  center_y=372 -->
  <rect x="800" y="338" width="310" height="68" rx="4" fill="var(--panel,#fff)" stroke="var(--cached,#0e9f6e)" stroke-width="1.8"/>
  <rect x="802" y="340" width="5" height="64" fill="var(--cached,#0e9f6e)" rx="1"/>
  <text x="960" y="365" font-size="14" font-weight="600" fill="var(--cached,#0e9f6e)" text-anchor="middle">Feature Cache (S3)</text>
  <text x="960" y="383" font-size="10" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)" text-anchor="middle">feature parquet keyed by source + config hash</text>

  <!-- Object Store  y=448–516  center_y=482 -->
  <rect x="800" y="448" width="310" height="68" rx="4" fill="var(--panel,#fff)" stroke="var(--art,#e3850a)" stroke-width="1.8"/>
  <rect x="802" y="450" width="5" height="64" fill="var(--art,#e3850a)" rx="1"/>
  <text x="960" y="475" font-size="14" font-weight="600" fill="var(--art,#e3850a)" text-anchor="middle">Object Store (S3)</text>
  <text x="960" y="493" font-size="10" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)" text-anchor="middle">Parquet · annotations · runs/{run_id}/ artifacts</text>

  <!-- ===== WRITE WIRES  stage → store (solid, coloured) ===== -->

  <!-- make-splits  → PostgreSQL   [blue]  exits stage at y=228, arrives PG y=146 -->
  <path d="M600,228 H616 V146 H800" fill="none" stroke="var(--db,#2f6fed)"     stroke-width="1.8" marker-end="url(#m-db)"/>
  <!-- train-all    → PostgreSQL   [blue]  exits TA  at y=412, arrives PG y=152 -->
  <path d="M600,412 H624 V152 H800" fill="none" stroke="var(--db,#2f6fed)"     stroke-width="1.8" marker-end="url(#m-db)"/>
  <!-- evaluate     → PostgreSQL   [blue]  exits EV  at y=502, arrives PG y=158 -->
  <path d="M600,502 H632 V158 H800" fill="none" stroke="var(--db,#2f6fed)"     stroke-width="1.8" marker-end="url(#m-db)"/>

  <!-- make-splits  → Split Cache  [green] exits MS  at y=238, arrives SC y=262  (near-horizontal) -->
  <path d="M600,238 H642 V262 H800" fill="none" stroke="var(--cached,#0e9f6e)" stroke-width="1.8" marker-end="url(#m-cache)"/>
  <!-- build-feat.  → Feature Cache[green] exits BF  at y=336, arrives FC y=372  (near-horizontal) -->
  <path d="M600,336 H650 V372 H800" fill="none" stroke="var(--cached,#0e9f6e)" stroke-width="1.8" marker-end="url(#m-cache)"/>

  <!-- build-feat.  → Object Store [orange]exits BF  at y=344, arrives OS y=462 -->
  <path d="M600,344 H660 V462 H800" fill="none" stroke="var(--art,#e3850a)"    stroke-width="1.8" marker-end="url(#m-art)"/>
  <!-- train-all    → Object Store [orange]exits TA  at y=422, arrives OS y=470 -->
  <path d="M600,422 H668 V470 H800" fill="none" stroke="var(--art,#e3850a)"    stroke-width="1.8" marker-end="url(#m-art)"/>
  <!-- evaluate     → Object Store [orange]exits EV  at y=514, arrives OS y=478 -->
  <path d="M600,514 H676 V478 H800" fill="none" stroke="var(--art,#e3850a)"    stroke-width="1.8" marker-end="url(#m-art)"/>
  <!-- write-matrix → Object Store [orange]exits WM  at y=590, arrives OS y=486 -->
  <path d="M600,590 H684 V486 H800" fill="none" stroke="var(--art,#e3850a)"    stroke-width="1.8" marker-end="url(#m-art)"/>

  <!-- ===== READ WIRES  store → stage (dashed grey) ===== -->

  <!-- PostgreSQL   → make-splits  exits PG y=170, arrives MS y=246  (read lane x=750) -->
  <path d="M800,170 H750 V246 H600" fill="none" stroke="var(--read,#aeb4bc)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m-read)"/>
  <!-- PostgreSQL   → dashboard    exits PG y=180, arrives DS y=698  (read lane x=758) -->
  <path d="M800,180 H758 V698 H600" fill="none" stroke="var(--read,#aeb4bc)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m-read)"/>

  <!-- Split Cache  → make-splits  exits SC y=254, arrives MS y=252  (near-horizontal, lane x=764) -->
  <path d="M800,254 H764 V252 H600" fill="none" stroke="var(--read,#aeb4bc)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m-read)"/>
  <!-- Feature Cache→ build-feat.  exits FC y=364, arrives BF y=326  (lane x=770, short upward) -->
  <path d="M800,364 H770 V326 H600" fill="none" stroke="var(--read,#aeb4bc)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m-read)"/>

  <!-- Object Store → build-feat.  exits OS y=454, arrives BF y=318  (lane x=776) -->
  <path d="M800,454 H776 V318 H600" fill="none" stroke="var(--read,#aeb4bc)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m-read)"/>
  <!-- Object Store → dashboard    exits OS y=492, arrives DS y=706  (lane x=782) -->
  <path d="M800,492 H782 V706 H600" fill="none" stroke="var(--read,#aeb4bc)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m-read)"/>

  <!-- ===== PIPELINE FLOW ARROWS ===== -->
  <path d="M480 182V206" fill="none" stroke="var(--flow,#3a4049)" stroke-width="2" marker-end="url(#m-flow)"/>
  <path d="M480 272V296" fill="none" stroke="var(--flow,#3a4049)" stroke-width="2" marker-end="url(#m-flow)"/>
  <path d="M480 362V386" fill="none" stroke="var(--flow,#3a4049)" stroke-width="2" marker-end="url(#m-flow)"/>
  <path d="M480 452V476" fill="none" stroke="var(--flow,#3a4049)" stroke-width="2" marker-end="url(#m-flow)"/>
  <path d="M480 542V566" fill="none" stroke="var(--flow,#3a4049)" stroke-width="2" marker-end="url(#m-flow)"/>
  <path d="M480 632V656" fill="none" stroke="var(--flow,#3a4049)" stroke-width="2" marker-end="url(#m-flow)"/>

  <!-- ===== PIPELINE NODES ===== -->
  <!-- 01 validate-config -->
  <g>
    <rect x="360" y="120" width="240" height="60" rx="3" fill="var(--panel,#fff)" stroke="var(--muted,#868c95)" stroke-width="2"/>
    <rect x="362" y="123" width="4" height="54" fill="var(--muted,#868c95)"/>
    <text x="374" y="138" font-size="9" font-weight="600" fill="var(--muted,#868c95)" letter-spacing="1">01</text>
    <text x="484" y="148" font-size="15" font-weight="600" fill="var(--ink,#1f2329)" text-anchor="middle">validate-config</text>
    <text x="484" y="165" font-size="10.5" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)" text-anchor="middle">YAML · connections</text>
    <rect x="538" y="110" width="54" height="20" rx="10" fill="var(--panel,#fff)" stroke="var(--muted,#868c95)" stroke-width="1.2"/>
    <text x="565" y="123.5" font-size="9.5" font-weight="600" fill="var(--muted,#868c95)" text-anchor="middle" letter-spacing="0.5">SETUP</text>
  </g>
  <!-- 02 make-splits -->
  <g>
    <rect x="360" y="210" width="240" height="60" rx="3" fill="var(--panel,#fff)" stroke="var(--cached,#0e9f6e)" stroke-width="2"/>
    <rect x="362" y="213" width="4" height="54" fill="var(--cached,#0e9f6e)"/>
    <text x="374" y="228" font-size="9" font-weight="600" fill="var(--cached,#0e9f6e)" letter-spacing="1">02</text>
    <text x="484" y="238" font-size="15" font-weight="600" fill="var(--ink,#1f2329)" text-anchor="middle">make-splits</text>
    <text x="484" y="255" font-size="10.5" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)" text-anchor="middle">subject-safe · stratified</text>
    <rect x="530" y="200" width="62" height="20" rx="10" fill="var(--panel,#fff)" stroke="var(--cached,#0e9f6e)" stroke-width="1.2"/>
    <text x="561" y="213.5" font-size="9.5" font-weight="600" fill="var(--cached,#0e9f6e)" text-anchor="middle" letter-spacing="0.5">CACHED</text>
  </g>
  <!-- 03 build-features -->
  <g>
    <rect x="360" y="300" width="240" height="60" rx="3" fill="var(--panel,#fff)" stroke="var(--cached,#0e9f6e)" stroke-width="2"/>
    <rect x="362" y="303" width="4" height="54" fill="var(--cached,#0e9f6e)"/>
    <text x="374" y="318" font-size="9" font-weight="600" fill="var(--cached,#0e9f6e)" letter-spacing="1">03</text>
    <text x="484" y="328" font-size="15" font-weight="600" fill="var(--ink,#1f2329)" text-anchor="middle">build-features</text>
    <text x="484" y="345" font-size="10.5" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)" text-anchor="middle">PySpark · 10 s windows</text>
    <rect x="530" y="290" width="62" height="20" rx="10" fill="var(--panel,#fff)" stroke="var(--cached,#0e9f6e)" stroke-width="1.2"/>
    <text x="561" y="303.5" font-size="9.5" font-weight="600" fill="var(--cached,#0e9f6e)" text-anchor="middle" letter-spacing="0.5">CACHED</text>
  </g>
  <!-- 04 train-all -->
  <g>
    <rect x="360" y="390" width="240" height="60" rx="3" fill="var(--panel,#fff)" stroke="var(--muted,#868c95)" stroke-width="2"/>
    <rect x="362" y="393" width="4" height="54" fill="var(--muted,#868c95)"/>
    <text x="374" y="408" font-size="9" font-weight="600" fill="var(--muted,#868c95)" letter-spacing="1">04</text>
    <text x="484" y="418" font-size="15" font-weight="600" fill="var(--ink,#1f2329)" text-anchor="middle">train-all</text>
    <text x="484" y="435" font-size="10.5" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)" text-anchor="middle">per source × model</text>
  </g>
  <!-- 05 evaluate -->
  <g>
    <rect x="360" y="480" width="240" height="60" rx="3" fill="var(--panel,#fff)" stroke="var(--muted,#868c95)" stroke-width="2"/>
    <rect x="362" y="483" width="4" height="54" fill="var(--muted,#868c95)"/>
    <text x="374" y="498" font-size="9" font-weight="600" fill="var(--muted,#868c95)" letter-spacing="1">05</text>
    <text x="484" y="508" font-size="15" font-weight="600" fill="var(--ink,#1f2329)" text-anchor="middle">evaluate</text>
    <text x="484" y="525" font-size="10.5" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)" text-anchor="middle">window + recording metrics</text>
  </g>
  <!-- 06 write-matrix -->
  <g>
    <rect x="360" y="570" width="240" height="60" rx="3" fill="var(--panel,#fff)" stroke="var(--art,#e3850a)" stroke-width="2"/>
    <rect x="362" y="573" width="4" height="54" fill="var(--art,#e3850a)"/>
    <text x="374" y="588" font-size="9" font-weight="600" fill="var(--art,#e3850a)" letter-spacing="1">06</text>
    <text x="484" y="598" font-size="15" font-weight="600" fill="var(--ink,#1f2329)" text-anchor="middle">write-matrix</text>
    <text x="484" y="615" font-size="10.5" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)" text-anchor="middle">pivot → CSV</text>
    <rect x="532" y="560" width="60" height="20" rx="10" fill="var(--panel,#fff)" stroke="var(--art,#e3850a)" stroke-width="1.2"/>
    <text x="562" y="573.5" font-size="9.5" font-weight="600" fill="var(--art,#e3850a)" text-anchor="middle" letter-spacing="0.5">EXPORT</text>
  </g>
  <!-- 07 dashboard -->
  <g>
    <rect x="360" y="660" width="240" height="60" rx="3" fill="var(--panel,#fff)" stroke="var(--term,#e02f4f)" stroke-width="2"/>
    <rect x="362" y="663" width="4" height="54" fill="var(--term,#e02f4f)"/>
    <text x="374" y="678" font-size="9" font-weight="600" fill="var(--term,#e02f4f)" letter-spacing="1">07</text>
    <text x="484" y="688" font-size="15" font-weight="600" fill="var(--ink,#1f2329)" text-anchor="middle">dashboard</text>
    <text x="484" y="705" font-size="10.5" font-family="'IBM Plex Sans',system-ui,sans-serif" fill="var(--muted,#868c95)" text-anchor="middle">serve · port 8765</text>
    <rect x="538" y="650" width="54" height="20" rx="10" fill="var(--panel,#fff)" stroke="var(--term,#e02f4f)" stroke-width="1.2"/>
    <text x="565" y="663.5" font-size="9.5" font-weight="600" fill="var(--term,#e02f4f)" text-anchor="middle" letter-spacing="0.5">SERVE</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g font-family="'IBM Plex Mono',monospace" font-size="11">
    <rect x="60"  y="802" width="14" height="14" rx="2" fill="none" stroke="var(--cached,#0e9f6e)" stroke-width="2"/>
    <text x="80"  y="813" fill="var(--ink,#1f2329)">cached</text>
    <path d="M158 809H182" stroke="var(--db,#2f6fed)"  stroke-width="2" marker-end="url(#m-db)"/>
    <text x="190" y="813" fill="var(--ink,#1f2329)">DB write</text>
    <path d="M278 809H302" stroke="var(--art,#e3850a)" stroke-width="2" marker-end="url(#m-art)"/>
    <text x="310" y="813" fill="var(--ink,#1f2329)">artifact write</text>
    <path d="M430 809H454" stroke="var(--cached,#0e9f6e)" stroke-width="2" marker-end="url(#m-cache)"/>
    <text x="462" y="813" fill="var(--ink,#1f2329)">cache write</text>
    <path d="M562 809H586" stroke="var(--read,#aeb4bc)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m-read)"/>
    <text x="594" y="813" fill="var(--ink,#1f2329)">read / input</text>
  </g>
</svg></div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
