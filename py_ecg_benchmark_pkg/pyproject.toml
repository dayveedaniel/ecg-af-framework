[project]
name = "py-ecg-benchmark-pkg"
version = "0.1.0"
description = "AF detection benchmark framework for processed ECG datasets."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "psycopg2-binary>=2.9",
    "pyspark>=3.5,<4",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
raw = [
    "torch>=2.1",
]
test = [
    "pytest>=8",
]

[project.scripts]
ecg-bench = "ecg_benchmark.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
