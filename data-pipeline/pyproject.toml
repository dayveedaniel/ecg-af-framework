[project]
name = "ecg-data-pipeline"
version = "0.1.0"
description = "ECG dataset ingestion + processing pipeline (MinIO/S3 + Postgres)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.13"
dependencies = [
  "boto3>=1.33.2,<1.34.35",
  "botocore>=1.33.2,<1.34.35",
  "h5py>=3.10",
  "numpy>=1.26",
  "pandas>=2.2.2",
  "psycopg2-binary>=2.9",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scipy>=1.12",
  "wfdb>=4.1",
]

[project.optional-dependencies]
spark = [
  "pyspark==3.5.*",
]
airflow = [
  "apache-airflow==2.8.*; python_version < '3.12'",
  "pyspark==3.5.*",
]
benchmark = [
  "pyspark==3.5.*",
  "scikit-learn>=1.4",
  "torch>=2.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
