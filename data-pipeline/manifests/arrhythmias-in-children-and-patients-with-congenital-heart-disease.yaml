dataset:
  name: "arrhythmias-in-children-and-patients-with-congenital-heart-disease"
  display_name: "Arrhythmias in Children and Patients with Congenital Heart Disease"
  version: "1.0.0"

source:
  url: "https://physionet.org/content/leipzig-heart-center-ecg/1.0.0/"
  provider: "physionet_s3"

force_redownload: false

metadata:
  description: "Single-lead and two-lead long-term ECG recordings from children and adults with congenital heart disease, with beat and rhythm annotations."
  citation: "Nospes S, et al. Leipzig Heart Center ECG Database. PhysioNet (v1.0.0). https://physionet.org/content/leipzig-heart-center-ecg/1.0.0/"
  license: "ODC-By 1.0"
  geographic_origin: "Leipzig, Germany"
  num_subjects: 218
  num_recordings: 218
  leads:
    - "ECG1"
    - "ECG2"

annotations:
  adapter: "leipzig_heart_center_ecg_v1"
  options:
    annotation_extension: "atr"
  available: true
  types:
    - "beat_labels"
    - "rhythm_labels"

quirks:
  - "Demographics are split across adults-subject-info.csv and children-subject-info.csv."
  - "A subset of recordings are single-lead while others are two-lead."
