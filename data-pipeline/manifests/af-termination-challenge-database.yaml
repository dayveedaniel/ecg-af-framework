dataset:
  name: "af-termination-challenge-database"
  display_name: "AF Termination Challenge Database"
  version: "1.0.0"

source:
  url: "https://physionet.org/content/aftdb/1.0.0/"
  provider: "physionet_s3"

force_redownload: false

metadata:
  description: "One-minute ECG excerpts preceding spontaneous AF termination or continuation, with beat annotations."
  citation: "Petrutiu S, et al. AF Termination Challenge Database. PhysioNet v1.0.0. https://physionet.org/content/aftdb/1.0.0/"
  license: "ODC-By 1.0"
  geographic_origin: "Europe"
  num_subjects: 50
  num_recordings: 140
  leads:
    - "ECG1"
    - "ECG2"

annotations:
  adapter: "aftdb_v1"
  options:
    beat_annotation_extension: "qrs"
  available: true
  types:
    - "beat_labels"
    - "rhythm_labels"

quirks:
  - "learning-set contains n/s/t record groups; test-set-a and test-set-b contain unlabeled challenge sets."
  - "No native rhythm interval sidecar is provided; AF rhythm is represented as a full-record synthetic episode."
