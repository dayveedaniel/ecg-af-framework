dataset:
  name: "cpsc-2021-paroxysmal-af-event-detection-dataset"
  display_name: "CPSC 2021 Paroxysmal AF Event Detection Dataset"
  version: "1.0.0"

source:
  url: "https://physionet.org/content/cpsc2021/1.0.0/"
  provider: "physionet_s3"

force_redownload: false

metadata:
  description: "Two-lead long-term ECG recordings from CPSC 2021 with paroxysmal, persistent, and non-AF rhythm annotations."
  citation: "CPSC 2021 Challenge Dataset (Paroxysmal AF Event Detection), PhysioNet v1.0.0. https://physionet.org/content/cpsc2021/1.0.0/"
  license: "CC BY 4.0"
  geographic_origin: "China"
  num_subjects: null
  num_recordings: 1436
  leads:
    - "ECG1"
    - "ECG2"

annotations:
  adapter: "cpsc2021_paroxysmal_af_v1"
  options:
    annotation_extension: "atr"
  available: true
  types:
    - "beat_labels"
    - "rhythm_labels"

quirks:
  - "Records are distributed under Training_set_I and Training_set_II directories."
  - "Header comments include record-level rhythm class; transitions are encoded in .atr aux notes."
